name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash # -eo pipefail: a failing check inside a pipeline fails the step

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Plugin tests
        run: node --test plugins/agy/scripts/*.test.mts

      - name: Validate the marketplace and every item
        # The root validate does not open the plugins' own files, so each item is validated too.
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate --strict .
          for dir in skills/*/ plugins/*/; do claude plugin validate --strict "$dir"; done

      - name: Marketplace entry names match plugin.json names
        run: |
          jq -r '.plugins[] | "\(.name) \(.source)"' .claude-plugin/marketplace.json |
            while read -r name source; do
              actual=$(jq -r .name "$source/.claude-plugin/plugin.json")
              [ "$actual" = "$name" ] || { echo "::error::$source is named $actual, marketplace says $name"; exit 1; }
            done

      - name: No broken symlinks
        run: |
          broken=$(find skills plugins -xtype l)
          [ -z "$broken" ] || { echo "::error::broken symlinks: $broken"; exit 1; }

      - name: npx skills catalog matches the expected list
        # Plugin-internal skills must stay hidden (metadata.internal); update this list when adding a skill.
        run: |
          NO_COLOR=1 npx --yes skills@1.5.9 add . --list |
            sed -nE 's/^│ {4}([a-z0-9][a-z0-9-]*)$/\1/p' | sort > catalog.txt
          printf '%s\n' adveloop cmux commit compress isolate refine-prompt relamo select write | diff - catalog.txt
