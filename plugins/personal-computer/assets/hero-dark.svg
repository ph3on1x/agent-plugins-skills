<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="t d">
<title id="t">personal-computer: personal data is checked on your machine before Claude reads it</title>
<desc id="d">Tool output, attached and @-mentioned files, background-task notifications and your prompts are checked on your machine by two local models and checksums. Output without personal data reaches Claude as it is; output with personal data is replaced by a notice. Claude hands that part of the task to your private model, an anymodel agent that reads the data on your machine, and its answer is checked again before Claude reads it. No proxy: Remote Control keeps working.</desc>
<style>.flow{stroke-dasharray:1 9;stroke-linecap:round}@media (prefers-reduced-motion:no-preference){.flow{animation:flow 1.1s linear infinite}}@keyframes flow{to{stroke-dashoffset:-20}}</style>
