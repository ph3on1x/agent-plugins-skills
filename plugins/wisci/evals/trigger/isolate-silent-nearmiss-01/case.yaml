schema_version: "1.1"
name: isolate-silent-nearmiss-01
tags: ["trigger", "validation", "isolate", "silent", "nearmiss"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "spin up an Explore agent to find where SESSION_TTL is defined"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?isolate"'
    min: 0
    max: 0
