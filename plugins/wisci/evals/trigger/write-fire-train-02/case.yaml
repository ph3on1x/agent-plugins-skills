schema_version: "1.1"
name: write-fire-train-02
tags: ["trigger", "train", "write", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "persist these findings about the auth flow for future sessions: tokens are validated in src/auth/middleware.ts, nothing refreshes them, and SESSION_TTL is 3600 seconds"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write"'
