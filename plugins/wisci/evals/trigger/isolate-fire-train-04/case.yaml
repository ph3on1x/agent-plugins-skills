schema_version: "1.1"
name: isolate-fire-train-04
tags: ["trigger", "train", "isolate", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "compare React Query and SWR for this project"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?isolate"'
