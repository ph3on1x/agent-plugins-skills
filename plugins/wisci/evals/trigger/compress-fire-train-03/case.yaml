schema_version: "1.1"
name: compress-fire-train-03
tags: ["trigger", "train", "compress", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "snapshot where we are so tomorrow's session can continue"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?compress"'
