schema_version: "1.1"
name: isolate-fire-validation-03
tags: ["trigger", "validation", "isolate", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "find out how the webhook retry logic behaves across the codebase"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?isolate"'
