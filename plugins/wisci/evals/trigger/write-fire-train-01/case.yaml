schema_version: "1.1"
name: write-fire-train-01
tags: ["trigger", "train", "write", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "save this research so we don't lose it: sessions expire after 3600s (SESSION_TTL in src/auth/session.ts), and the middleware only validates tokens, it never refreshes them"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write"'
