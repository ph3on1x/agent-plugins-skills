schema_version: "1.1"
name: select-silent-train-03
tags: ["trigger", "train", "select", "silent"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "load this CSV into a pandas dataframe"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?select"'
    min: 0
    max: 0
