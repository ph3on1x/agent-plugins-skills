schema_version: "1.1"
name: compress-silent-validation-02
tags: ["trigger", "validation", "compress", "silent"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "compact the sqlite database"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?compress"'
    min: 0
    max: 0
