schema_version: "1.1"
name: select-fire-train-04
tags: ["trigger", "train", "select", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "what do our stored notes say about session expiry?"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?select"'
