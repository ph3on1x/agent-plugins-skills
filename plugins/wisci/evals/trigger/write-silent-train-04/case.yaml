schema_version: "1.1"
name: write-silent-train-04
tags: ["trigger", "train", "write", "silent"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "write a README for this repo"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write"'
    min: 0
    max: 0
