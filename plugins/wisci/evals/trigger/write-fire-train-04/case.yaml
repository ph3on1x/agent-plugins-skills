schema_version: "1.1"
name: write-fire-train-04
tags: ["trigger", "train", "write", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "write down these architecture decisions somewhere permanent: auth stays in Express middleware instead of a gateway, and sessions stay server-side with a one-hour TTL"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write"'
