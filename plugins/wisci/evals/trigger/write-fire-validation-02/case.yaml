schema_version: "1.1"
name: write-fire-validation-02
tags: ["trigger", "validation", "write", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "store this comparison of the two libraries in the project notes: jose verifies JWTs with no native deps and supports key rotation; jsonwebtoken is older, synchronous by default, and lacks JWK sets"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?write"'
