schema_version: "1.1"
name: select-fire-validation-01
tags: ["trigger", "validation", "select", "fire"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "load everything relevant to the auth work"
  max_turns: 3
  timeout_seconds: 240
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?select"'
