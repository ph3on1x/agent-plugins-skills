schema_version: "1.1"
name: compress-new-stream
tags: ["task", "compress"]
context:
  scaffold_script: fixture.sh
execution:
  prompt: "/wisci:compress rate-limiter \u2014 this session we designed a token bucket limiter for src/api/limiter.ts (100 req/min per user). We tried nginx-level limiting first and dropped it because we need per-user state. My constraint: no new runtime dependencies. Next step: implement the bucket store."
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
graders:
  - name: "reserved-leaf"
    type: "tool_used"
    tool: "Bash"
    input_match: "wisci\\.py[^a-z]{0,6}new handoff"
  - name: "ruled-out-section"
    type: "tool_used"
    tool: "Write"
    input_match: "## Tried / Ruled out[\\s\\S]*nginx"
  - name: "constraint-verbatim"
    type: "tool_used"
    tool: "Write"
    input_match: "[Nn]o new runtime dependencies"
