<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 538" width="1280" height="538" role="img" aria-labelledby="t d">
<title id="t">anymodel in a terminal</title>
<desc id="d">Real output: /anymodel check tests three agents, then the kimi agent on OpenRouter counts the rows of a CSV file and sums its positive amounts.</desc>
