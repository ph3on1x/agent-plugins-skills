<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 530" width="1280" height="530" role="img" aria-labelledby="t d">
<title id="t">anymodel: Claude Code subagents on any model</title>
<desc id="d">Your main Claude Code session talks to Anthropic directly, with no proxy, so Remote Control keeps working and your login is untouched. It hands tasks to anymodel agents, each a full Claude Code session on its own model: Qwen on your machine, Kimi K3 and DeepSeek on OpenRouter.</desc>
